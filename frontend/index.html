    <meta name="theme-color" content="#0B0A18" />
    <script>
      (() => {
        const saved = localStorage.getItem("dumo-theme");
        const manual = localStorage.getItem("dumo-theme-user-set") === "true";
        const dark = manual ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
